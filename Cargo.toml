[package]
name = "vlitedb"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "Apache-2.0"
description = "A single-binary vector database. SQLite for vectors."
repository = "https://github.com/youssef-hamada/vector-lite.git"

[lib]
name = "vectorlite"
crate-type = ["rlib"]

[[bin]]
name = "vectorlite"
path = "src/bin/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
rayon = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
proptest = "1"
tempfile = "3"
rand = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3